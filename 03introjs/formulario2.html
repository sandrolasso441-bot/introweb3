<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <!-- Se corrigió el valor de viewport quitando los caracteres '<' y '>' sobrantes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personas</title>
</head>

<body>
    <h2>Registro de Personas</h2>

    <form id="Formulario">
        <table>
            <tr>
                <td>Nombres:</td>
                <td>
                    <input id="txtNombres" type="text" required />
                </td>
            </tr>

            <tr>
                <td>Apellidos:</td>
                <td>
                    <input id="txtApellidos" type="text" required/>
                </td>
            </tr>

            <tr>
                <td>Correo:</td>
                <td>
                    <input id="txtCorreo" type="email" required/>
                </td>
            </tr>

            <tr>
                <td>Edad:</td>
                <td>
                    <input id="txtEdad" type="number" required/>
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <button id="boton_registrar" type="submit">Registrar</button>
                    
                </td>
            </tr>
        </table>
    </form>
    <button id="btnTabla" type="submit">Taba_multiplicar</button>

    <h3>Persona registrada</h3>

    <div id="resultado">
        Ninguno
    </div>

    
</body>
<script src="js/script.js"/> </script>

</html>
